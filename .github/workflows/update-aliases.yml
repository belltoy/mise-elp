name: Update aliases

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: mise-tasks/update-aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git diff --quiet bin/list-aliases && exit 0
          date=$(gh api repos/WhatsApp/erlang-language-platform/releases/latest --jq .tag_name)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update to $date"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
